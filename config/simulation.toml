[rate]
target_hz = 30

[simulation]
thermal_motion_scale = 0.08

[solver_tuning]
enable_buoyancy = true
buoyancy_strength = 0.22
buoyancy_window_radius = 2
buoyancy_window_sigma = 1.2
buoyancy_gain = 3.2
buoyancy_alpha = 1.0
buoyancy_force_cap = 0.30

[pipe]
cell_volume_ratio = 25.0
cell_particle_pressure_pa = 1.0
pipe_flux_gain = 8000.0
pipe_flux_damping = 0.993
max_pipe_flux_particles_per_tick = 50000.0
vent_discharge_coefficient = 7.8
max_vent_flux_particles_per_tick = 200000.0
vent_choked_pressure_ratio = 0.53
pressure_epsilon_pa = 0.01

[visual]
gamma = 1.0
max_particles_for_max_color = 1000
f1_min_particles = 1.0
f1_max_particles_for_max_intensity = 100.0
f1_min_intensity = 0.05
f1_alpha = 0.88
