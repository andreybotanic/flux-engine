[package]
name = "flux_engine"
version = "0.1.0"
edition = "2021"
default-run = "flux_engine"

[workspace]
members = [
    ".",
    "xtask",
    "xtask_wgsl",
    "crates/flux_plugin_sdk",
    "crates/flux_plugin_abi",
]
exclude = [
    "src/plugins/flux_stage1_sample_plugin",
    "src/plugins/flux_stage7_sample_content_plugin",
]
resolver = "2"

[dependencies]
bevy = { version = "0.16", default-features = true, features = ["mp3"] }
bytemuck = { version = "1.19", features = ["derive"] }
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
wgpu = "24.0"
humantime = "2.1"
image = "0.25.10"
time = { version = "0.3", features = ["local-offset"] }
libloading = "0.8"
semver = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flux_plugin_sdk = { path = "crates/flux_plugin_sdk" }
flux_plugin_abi = { path = "crates/flux_plugin_abi" }
